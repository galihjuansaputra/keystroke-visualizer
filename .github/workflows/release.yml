name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Keystroke Visualizer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconsole --onefile --clean --add-data "sounds;sounds" --add-data "checkmark.png;." --icon=app_icon.ico --name="KeystrokeVisualizer" main.py

      - name: Create ZIP Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "KeystrokeVisualizer-${tag}-windows-x64.zip"
          Compress-Archive -Path "dist/KeystrokeVisualizer.exe", "README.md" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KeystrokeVisualizer.exe
            ${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
